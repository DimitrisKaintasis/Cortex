[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-retrieval"
version = "0.1.0"
description = "A tag-centric, explainable data retrieval engine."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ijson>=3.4,<4",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "temporal-history @ git+https://github.com/tedboudros/temporal-history.git@f2851f28920945f5689c646566d0c69b58065814",
]

[project.scripts]
data-retrieval = "data_retrieval.cli:main"

[project.optional-dependencies]
mem0 = [
    "mem0ai==1.0.1",
    "kuzu>=0.11,<1",
    "ollama>=0.6,<1",
    "rank-bm25>=0.2,<1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
