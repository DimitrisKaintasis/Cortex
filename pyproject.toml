[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-retrieval"
version = "0.1.0"
description = "Explainable, adaptive retrieval for long-lived AI memory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
data-retrieval = "data_retrieval.cli:main"
cortex-devui = "cortex_devui.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.128,<1",
    "uvicorn>=0.38,<1",
]
postgres = [
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
]
temporal = [
    "click>=8.1,<9",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]
sdk = [
    "httpx>=0.28,<1",
]
devui = [
    "httpx>=0.28,<1",
]
mcp = [
    "mcp>=2.2,<3",
]
benchmarks = [
    "ijson>=3.4,<4",
    "click>=8.1,<9",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]
mem0 = [
    "mem0ai==1.0.1",
    "kuzu>=0.11,<1",
    "ollama>=0.6,<1",
    "rank-bm25>=0.2,<1",
]
all = [
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.38,<1",
    "ijson>=3.4,<4",
    "mcp>=2.2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "click>=8.1,<9",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "mem0ai==1.0.1",
    "kuzu>=0.11,<1",
    "ollama>=0.6,<1",
    "rank-bm25>=0.2,<1",
]
dev = [
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "ijson>=3.4,<4",
    "mcp>=2.2,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pyright>=1.1.414,<2",
    "pytest>=8,<10",
    "python-dotenv>=1.0,<2",
    "ruff>=0.9,<1",
    "uvicorn>=0.38,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temporal_history = ["graph_template.html", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["src/temporal_history"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = [
    "src/cortex",
    "src/cortex_devui",
    "src/data_retrieval/api.py",
    "src/data_retrieval/core",
    "src/data_retrieval/connectors",
    "src/data_retrieval/local_runtime.py",
    "src/data_retrieval/mcp_server.py",
    "src/data_retrieval/domain",
    "src/data_retrieval/ingestion",
    "src/data_retrieval/storage/repository.py",
    "src/data_retrieval/retrieval/models.py",
    "src/data_retrieval/retrieval/embedding.py",
    "src/data_retrieval/retrieval/packing.py",
    "src/data_retrieval/services/ingestion.py",
    "src/data_retrieval/services/connector_sync.py",
    "src/data_retrieval/services/connector_access.py",
    "src/data_retrieval/services/retrieval.py",
]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
