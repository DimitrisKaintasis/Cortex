name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Optional dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]" pip-audit
      # Cortex rejects every Mem0 vector backend except Qdrant before Mem0 is initialized.
      # PYSEC-2026-2636 affects Mem0 1.0.1's unused FAISS pickle persistence. Mem0 2.x
      # removes the graph API this integration uses, so the exception stays narrow and visible.
      # Local/VCS packages are not indexed by PyPI; their installed dependencies are audited.
      - run: >-
          python -m pip_audit --local --skip-editable
          --ignore-vuln PYSEC-2026-2636

  sqlite-core:
    name: SQLite core (minimal install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python scripts/smoke_minimal_install.py

  quality:
    name: Quality (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu full
            install-target: ".[all,dev]"
          - os: windows-latest
            label: Windows full
            install-target: ".[all,dev]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "${{ matrix.install-target }}"
      - run: python -m ruff check src tests scripts/smoke_minimal_install.py
      - run: python -m pyright
      - run: python -m pytest

  postgresql:
    name: PostgreSQL adapter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: data_retrieval
          POSTGRES_USER: data_retrieval
          POSTGRES_PASSWORD: data_retrieval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_retrieval -d data_retrieval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATA_RETRIEVAL_TEST_POSTGRES_DSN: postgresql://data_retrieval:data_retrieval_test@127.0.0.1:5432/data_retrieval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_postgresql_repository.py
