name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-core:
    name: SQLite core (minimal install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python scripts/smoke_minimal_install.py

  quality:
    name: Lint and test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts/smoke_minimal_install.py
      - run: python -m pytest

  postgresql:
    name: PostgreSQL adapter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: data_retrieval
          POSTGRES_USER: data_retrieval
          POSTGRES_PASSWORD: data_retrieval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_retrieval -d data_retrieval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATA_RETRIEVAL_TEST_POSTGRES_DSN: postgresql://data_retrieval:data_retrieval_test@127.0.0.1:5432/data_retrieval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_postgresql_repository.py
